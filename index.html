<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>

<body>
    <video class="bg-video" autoplay muted loop>
        <source src="image/website_bg.mp4" type="video/mp4">
    </video>
    
    <div class="container">
        <div class="search-box">
            <i class="bx bx-location"></i>
            <input type="text" placeholder="Enter The Location">
            <button class="bx bx-search"></button>
        </div>
        
        <p class="city-hide">city Hide</p>
        
        <div class="weather-box">
            <div class="box">
                <div class="info-weather">
                    <div class="weather">
                        <img src="image/cloud.png" alt="">
                        <p class="temparature">0<span>°C</span></p>
                        <p class="description">Broken Clouds</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="weather-details">
            <div class="humidity">
                <i class="bx bx-water"></i>
                <div class="text">
                    <div class="info-humidity">
                        <span>0%</span>
                    </div>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="Wind">
                <i class="bx bx-wind"></i>
                <div class="text">
                    <div class="info-Wind">
                        <span>0 Km/h</span>
                    </div>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
        
        <div class="not-found">
            <div class="box">
                <img src="image/404_3.png">
                <p>Oops! Location not Found.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
